name: Usage or installation help
description: Ask a reproducible question about installing or using the app.
title: "[Help] "
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider or area
      options:
        - Codex
        - Claude Code or Claude Desktop
        - Kimi Desktop or Kimi Code
        - Automatic source selection
        - Installation or Gatekeeper
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.8.3
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.6
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What happened?
      description: Include the expected result and the smallest reproducible steps.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed tokens, cookies, credentials, prompts, private logs, and personal screenshots.
          required: true
